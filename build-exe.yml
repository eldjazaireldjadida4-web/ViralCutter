name: Build Windows EXE

# The #1 adoption barrier: PyInstaller cannot cross-compile, so the Windows
# .exe used to require a manual build on a Windows machine. This workflow
# builds it on a GitHub Windows runner and attaches it to Releases — no local
# Windows box needed anymore.
#
# Triggers:
#   * push of a v* tag   → builds AND creates/updates a GitHub Release with
#                          ViralCutter.exe + fpcalc bundled inside
#   * manual dispatch    → builds the current branch and uploads the exe as a
#                          workflow artifact (for testing) — no release created
#
# The exe ships with fpcalc.exe (music fingerprint check) bundled; ffmpeg is
# NOT bundled (license/size) — see packaging/viralcutter.spec.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        shell: bash
        run: |
          pip install --upgrade pip
          pip install pyinstaller
          # Runtime deps pulled into the bundle via hiddenimports in the spec.
          # Install the light core only; heavy optional stacks (whisperx,
          # insightface, gradio) are collected by the spec's hiddenimports —
          # install them too so the bundle actually contains them.
          pip install -r requirements.txt || echo "WARN: some optional deps failed to install on this runner"
          pip install -r requirements-upload.txt || echo "WARN: upload stack incomplete"

      - name: Download fpcalc.exe (chromaprint) for bundling
        shell: bash
        run: |
          mkdir -p packaging/third_party
          # Pinned release; see scripts/music_fingerprint.py (FPCalc_RELEASE).
          curl -L -o fpcalc.zip \
            "https://github.com/acoustid/chromaprint/releases/download/v1.5.1/chromaprint-fpcalc-1.5.1-windows-x86_64.zip"
          unzip -o fpcalc.zip -d fpcalc_tmp
          find fpcalc_tmp -name "fpcalc.exe" -exec cp {} packaging/third_party/fpcalc.exe \;
          ls -lh packaging/third_party/

      - name: Build exe with PyInstaller
        shell: bash
        run: |
          pyinstaller packaging/viralcutter.spec --noconfirm --clean
          ls -lh dist/

      - name: Smoke-test the exe
        shell: bash
        run: |
          # Boot the CLI long enough to prove the bundle works (help + version).
          ./dist/ViralCutter.exe --help > exe_help.txt 2>&1 &
          EXE_PID=$!
          sleep 20
          if kill -0 $EXE_PID 2>/dev/null; then kill $EXE_PID; fi
          head -30 exe_help.txt || echo "smoke: exe started (no --help output expected for this entrypoint)"

      - name: Upload exe as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViralCutter-win-x64
          path: dist/ViralCutter.exe
          if-no-files-found: error

      - name: Create / update GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ViralCutter ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            dist/ViralCutter.exe
          generate_release_notes: true
