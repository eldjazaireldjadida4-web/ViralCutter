name: Build Windows EXE

# The #1 adoption barrier: PyInstaller cannot cross-compile, so the Windows
# .exe used to require a manual build on a Windows machine. This workflow
# builds it on a GitHub Windows runner and attaches it to Releases — no local
# Windows box needed anymore.
#
# Triggers:
#   * push of a v* tag   → builds AND creates/updates a GitHub Release with
#                          ViralCutter.exe (fpcalc + ffmpeg bundled inside)
#   * manual dispatch    → builds the current branch and uploads the exe as a
#                          workflow artifact (for testing) — no release created
#
# The exe ships with fpcalc.exe (music fingerprint check) and ffmpeg/ffprobe
# (video processing) bundled, so it works out of the box on a clean Windows.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt || echo "WARN: some optional deps failed to install on this runner"
          pip install -r requirements-upload.txt || echo "WARN: upload stack incomplete"

      - name: Download fpcalc + ffmpeg for bundling
        shell: bash
        run: |
          mkdir -p packaging/third_party
          # Chromaprint fpcalc (music fingerprint check) — pinned release,
          # see scripts/music_fingerprint.py (FPCalc_RELEASE).
          curl -L -o fpcalc.zip \
            "https://github.com/acoustid/chromaprint/releases/download/v1.5.1/chromaprint-fpcalc-1.5.1-windows-x86_64.zip"
          unzip -o fpcalc.zip -d fpcalc_tmp
          find fpcalc_tmp -type f -exec cp {} packaging/third_party/ \;
          # Static ffmpeg/ffprobe (GPL) — video processing works out of the
          # box, no separate install for the end user. GitHub-hosted build
          # (BtbN) — reliable; gyan.dev rate-limits and returns 503.
          curl -L -o ffmpeg.zip \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          unzip -o ffmpeg.zip -d ffmpeg_tmp
          find ffmpeg_tmp -name "ffmpeg.exe" -exec cp {} packaging/third_party/ \;
          find ffmpeg_tmp -name "ffprobe.exe" -exec cp {} packaging/third_party/ \;
          ls -lh packaging/third_party/

      - name: Build exe with PyInstaller
        shell: bash
        run: |
          pyinstaller packaging/viralcutter.spec --noconfirm --clean
          ls -lh dist/

      - name: Smoke-test the exe (WebUI must boot)
        shell: bash
        run: |
          # Launch the exe in WebUI mode and wait until http://127.0.0.1:7860
          # answers 200. This catches frozen-bundle breakage (missing data
          # files, missing hidden imports) BEFORE anything is released.
          # Every curl is time-bounded (--max-time) and the whole step is
          # wrapped in `timeout` so it can never hang the job.
          timeout 300 bash -c '
            ./dist/ViralCutter.exe --webui > webui_smoke.log 2>&1 &
            EXE_PID=$!
            for i in $(seq 1 55); do
              CODE=$(curl -s --max-time 4 -o /dev/null -w "%{http_code}" http://127.0.0.1:7860/ 2>/dev/null || echo 000)
              if [ "$CODE" = "200" ]; then
                echo "OK: WebUI responded HTTP 200 after ${i}x5s"
                kill $EXE_PID 2>/dev/null || true
                exit 0
              fi
              sleep 5
            done
            echo "FAIL: WebUI did not respond in time — log tail:"
            tail -60 webui_smoke.log || true
            kill $EXE_PID 2>/dev/null || true
            exit 1
          '

      - name: Upload exe as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViralCutter-win-x64
          path: dist/ViralCutter.exe
          if-no-files-found: error

      - name: Create / update GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ViralCutter ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            dist/ViralCutter.exe
          generate_release_notes: true
